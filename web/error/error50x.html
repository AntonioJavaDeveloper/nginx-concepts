<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Erro 50x</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #2c3e50, #4ca1af);
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
        }

        .error-code {
            font-size: 6rem;
            font-weight: 600;
            animation: pulse 1.5s infinite;
        }

        .message {
            font-size: 1.5rem;
            margin-top: 10px;
        }

        .subtext {
            margin-top: 10px;
            font-size: 1rem;
            color: #ccc;
        }

        a.button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #00bcd4;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.3s;
        }

        a.button:hover {
            background: #008c9e;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        @media (max-width: 480px) {
            .error-code {
                font-size: 4rem;
            }
            .message {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="error-code">50x</div>
    <div class="message">Estamos enfrentando dificuldades técnicas.</div>
    <div class="subtext">Algo deu errado no servidor. Já estamos trabalhando para resolver o problema.</div>
    <a class="button" href="/">Voltar ao início</a>
</div>
</body>
</html>
