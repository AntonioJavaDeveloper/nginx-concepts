# Define um grupo de servidores backend (upstream) chamado "games_api"
# Esse grupo será usado para balancear carga entre os containers games1, games2 e games3
upstream games_api {
    # Cada "server" representa um container da aplicação Java escutando na porta 9001
    server games1:9001;
    server games2:9001;
    server games3:9001;
}

# Define um grupo de servidores backend (upstream) chamado "games_api_round_robin"
# Esse grupo será usado para balancear carga entre os containers games1, games2 e games3
# É uma forma de balanceamento de carga que distribui solicitações entre vários servidores igualmente
upstream games_api_round_robin {
    # Não foi feita nenhuma configuração no de regras de balanceamento entre os servidores.
    server games1:9001;
    server games2:9001;
    server games3:9001;
}

# Define um grupo de servidores backend (upstream) chamado "games_api_weighted"
# Este grupo utiliza o balanceamento *round-robin ponderado*, onde servidores com peso maior recebem mais requisições
upstream games_api_weighted {
    # O servidor games1:9001 receberá o triplo de requisições em relação aos outros dois
    server games1:9001 weight=3;

    # Os servidores games2 e games3 têm peso padrão (1), ou seja, receberão menos requisições que games1
    server games2:9001;
    server games3:9001;
}

# Define um grupo de servidores backend (upstream) chamado "games_api_least_conn"
# Este grupo utiliza o balanceamento baseado em menor número de conexões ativas (least_conn)
# Útil quando os tempos de resposta dos servidores variam bastante
upstream games_api_least_conn {
    least_conn;

    # Os três servidores são tratados igualmente, mas o NGINX enviará requisições preferencialmente para o que estiver com menos conexões ativas
    server games1:9001;
    server games2:9001;
    server games3:9001;
}

# Define um novo servidor virtual (virtual host)
server {
    # Porta onde este servidor escutará requisições HTTP (nesse caso, porta interna 8080)
    listen 8080;

    # Tudo que COMEÇA com /round-robin vai para games_api
    location ^~ /round-robin {
        # ^ – início da string.
        # /round-robin – casa literalmente com /round-robin.
        # (/.*) – captura tudo que vem depois de /round-robin, incluindo a barra e qualquer outra coisa:
        # /games → captura /games
        # /games/list → captura /games/list
        # $ – fim da string.
        # Neste caso: (/.*) → vira $1
        # Exemplo prático:
        # URL original: /round-robin/games/list
        # Regex encontra: /round-robin/games/list
        # Grupo (/.*) captura: /games/list
        # Substituição: $1 vira /games/list
        rewrite ^/round-robin(/.*)$ $1 break;

        # Encaminha a requisição para o grupo "games_api" definido acima
        proxy_pass http://games_api_round_robin/;
        # Preserva o cabeçalho "Host" original da requisição. Ex.: Host: example.com(mesmo digitando examplo.com/abc/def)

        proxy_set_header Host $host;
        # Passa o IP real do cliente para o backend. Ex.: X-Real-IP: 192.168.1.100

        proxy_set_header X-Real-IP $remote_addr;
        # Adiciona o IP do cliente à cadeia de proxies no cabeçalho "X-Forwarded-For". Ex.: X-Forwarded-For: 192.168.1.100, 203.0.113.5, 10.1.1.20

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Tudo que COMEÇA com /weighted vai para games_api_weighted
    location ^~ /weighted {
        # ^ – início da string.
        # /weighted – casa literalmente com /weighted.
        # (/.*) – captura tudo que vem depois de /weighted, incluindo a barra e qualquer outra coisa:
        # /games → captura /games
        # /games/list → captura /games/list
        # $ – fim da string.
        # Neste caso: (/.*) → vira $1
        # Exemplo prático:
        # URL original: /weighted/games/list
        # Regex encontra: /weighted/games/list
        # Grupo (/.*) captura: /games/list
        # Substituição: $1 vira /games/list
        rewrite ^/weighted(/.*)$ $1 break;

        # Encaminha a requisição para o grupo "games_api_weighted" definido acima
        proxy_pass http://games_api_weighted/;

        # Preserva o cabeçalho "Host" original da requisição. Ex.: Host: example.com
        proxy_set_header Host $host;

        # Passa o IP real do cliente para o backend. Ex.: X-Real-IP: 192.168.1.100
        proxy_set_header X-Real-IP $remote_addr;

        # Adiciona o IP do cliente à cadeia de proxies no cabeçalho "X-Forwarded-For"
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Tudo que COMEÇA com /least-conn vai para games_api_least_conn
    location ^~ /least-conn {
        # ^ – início da string.
        # /least-conn – casa literalmente com /least-conn.
        # (/.*) – captura tudo que vem depois de /least-conn, incluindo a barra e qualquer outra coisa:
        # /games → captura /games
        # /games/list → captura /games/list
        # $ – fim da string.
        # Neste caso: (/.*) → vira $1
        # Exemplo prático:
        # URL original: /least-conn/games/list
        # Regex encontra: /least-conn/games/list
        # Grupo (/.*) captura: /games/list
        # Substituição: $1 vira /games/list
        rewrite ^/least-conn(/.*)$ $1 break;

        # Encaminha a requisição para o grupo "games_api_least_conn" definido acima
        proxy_pass http://games_api_least_conn/;

        # Preserva o cabeçalho "Host" original da requisição. Ex.: Host: example.com
        proxy_set_header Host $host;

        # Passa o IP real do cliente para o backend. Ex.: X-Real-IP: 192.168.1.100
        proxy_set_header X-Real-IP $remote_addr;

        # Adiciona o IP do cliente à cadeia de proxies no cabeçalho "X-Forwarded-For"
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Tudo que COMEÇA com / vai para games_api
    location / {
        # Encaminha a requisição para o grupo "games_api" definido acima
        proxy_pass http://games_api/;
        # Preserva o cabeçalho "Host" original da requisição. Ex.: Host: example.com(mesmo digitando examplo.com/abc/def)
        proxy_set_header Host $host;
        # Passa o IP real do cliente para o backend. Ex.: X-Real-IP: 192.168.1.100
        proxy_set_header X-Real-IP $remote_addr;
        # Adiciona o IP do cliente à cadeia de proxies no cabeçalho "X-Forwarded-For". Ex.: X-Forwarded-For: 192.168.1.100, 203.0.113.5, 10.1.1.20
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}