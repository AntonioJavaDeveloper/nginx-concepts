# Define um formato de log personalizado com informações úteis de requisições e desempenho
log_format custom_logs '$remote_addr [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       'real_ip=$http_x_forwarded_for '
                       'x_real_ip=$http_x_real_ip '
                       'ua="$upstream_addr" '
                       'rt=$request_time urt=$upstream_response_time';


# BACKENDS COM DIFERENTES ESTRATÉGIAS DE BALANCEAMENTO

upstream games_api {
    server games1:9001;
    server games2:9001;
    server games3:9001;
}

upstream games_api_round_robin {
    server games1:9001;
    server games2:9001;
    server games3:9001;
}

upstream games_api_weighted {
    server games1:9001 weight=3;
    server games2:9001;
    server games3:9001;
}

upstream games_api_least_conn {
    least_conn;
    server games1:9001;
    server games2:9001;
    server games3:9001;
}


# SERVIDOR VIRTUAL QUE FAZ O PROXY REVERSO

server {
    listen 8080;

    # Define o arquivo de log de acesso com o formato personalizado acima
    access_log /var/log/nginx/access.log custom_logs;

    # Define o arquivo de log de erros (nível de severidade: warn)
    error_log /var/log/nginx/error.log warn;

    # ROTA: /round-robin → Estratégia Round Robin
    location ^~ /round-robin {
        rewrite ^/round-robin(/.*)$ $1 break;
        proxy_pass http://games_api_round_robin/;

        # Cabeçalhos importantes para logging de IPs reais e host original
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ROTA: /weighted → Round Robin Ponderado
    location ^~ /weighted {
        rewrite ^/weighted(/.*)$ $1 break;
        proxy_pass http://games_api_weighted/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    #  ROTA: /least-conn → Estratégia de Menor Número de Conexões
    location ^~ /least-conn {
        rewrite ^/least-conn(/.*)$ $1 break;
        proxy_pass http://games_api_least_conn/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ROTA: default → Balanceamento padrão
    location / {
        proxy_pass http://games_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Ideal para comparações com as outras estratégias
    }
}

#| Campo                        | Variável NGINX            | Explicação no seu cenário                                                            |
#| ---------------------------- | ------------------------- | ------------------------------------------------------------------------------------ |
#| IP do proxy reverso          | `$remote_addr`            | IP do NGINX principal (`localhost:80`) que repassou a requisição                     |
#| IP original do cliente       | `$http_x_forwarded_for`   | IP real do cliente externo (ex: 187.55.66.77) enviado pelo proxy reverso da porta 80 |
#| IP alternativo do cliente    | `$http_x_real_ip`         | Também pode carregar o IP do cliente original. Usado como reforço em proxies duplos  |
#| Data e hora da requisição    | `$time_local`             | Quando o NGINX da porta 8080 recebeu a requisição                                    |
#| Requisição completa          | `$request`                | Ex: `GET /games/2 HTTP/1.1`. Mostra método, URI e protocolo                          |
#| Código de resposta HTTP      | `$status`                 | Ex: `200` (sucesso), `404` (não encontrado), `502` (erro no backend)                 |
#| Tamanho da resposta          | `$body_bytes_sent`        | Quantidade de dados (em bytes) enviados ao cliente                                   |
#| Página de origem             | `$http_referer`           | Página anterior que originou a chamada (se houver), ex: clique de um link            |
#| Agente do usuário            | `$http_user_agent`        | Identifica o cliente, como Chrome, Firefox, Postman etc.                             |
#| Backend que respondeu        | `$upstream_addr`          | IP e porta do container que processou a requisição, ex: `172.19.0.4:9001`            |
#| Tempo total da requisição    | `$request_time`           | Quanto tempo o NGINX demorou do recebimento até entregar a resposta                  |
#| Tempo de resposta do backend | `$upstream_response_time` | Quanto tempo o backend Java ou Laravel levou para processar a requisição             |