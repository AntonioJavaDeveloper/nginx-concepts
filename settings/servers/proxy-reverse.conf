# Define um novo servidor virtual (virtual host)
server {
    # Porta onde este servidor escutará requisições HTTP (porta padrão 80)
    listen 80;
    # Nome do host aceito por este servidor (neste caso, "localhost")
    server_name localhost;

    # Quando o path for exatamente /
    location = / {
        # Redireciona a requisição para o servidor padrão, que escuta na porta 8081
        proxy_pass http://server1:8081/index.html;

        # Encaminha o nome do host original para o servidor de destino
        proxy_set_header Host $host;
        # Encaminha o IP real do cliente para o servidor de destino
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Quando o path for exatamente /error
    location = /error {
        # Redireciona a requisição para o servidor existente em uma porta inexistente
        proxy_pass http://server1:1000;

        # Encaminha o nome do host original para o servidor de destino
        proxy_set_header Host $host;
        # Encaminha o IP real do cliente para o servidor de destino
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Tudo que COMEÇA com /laravel vai para nginx-laravel:8083
    location ^~ /laravel {
        # Redireciona tudo que COMEÇA com /laravel vai para nginx-laravel:8083, que atua como um proxy para o
        # laravel1:9000 (ex: http://localhost/laravel)
        # Não é preciso do rewrite se já está usando proxy_pass(comando abaixo) com a barra final (/) — pois a barra
        # automaticamente remove o prefixo do location(no caso /laravel) da URL de destino. No próximo location veremos
        # o uso do rewrite
        proxy_pass http://nginx-laravel:8083/;

        # Encaminha o nome do host original para o servidor de destino
        proxy_set_header Host $host;
        # Encaminha o IP real do cliente para o servidor de destino
        proxy_set_header X-Real-IP $remote_addr;

        # Permite que NGINX trate os erros retornados pelo backend (como 404, 500, etc)
        proxy_intercept_errors on;
    }

    # Tudo que COMEÇA com /api vai para nginx-java-balancer:8080
    location ^~ /api {
        # ^ – início da string.
        # /api – casa literalmente com /api.
        # (/.*) – captura tudo que vem depois de /api, incluindo a barra e qualquer outra coisa:
        # /games → captura /games
        # /games/list → captura /games/list
        # $ – fim da string.
        # Neste caso: (/.*) → vira $1
        # Exemplo prático:
        # URL original: /api/games/list
        # Regex encontra: /api/games/list
        # Grupo (/.*) captura: /games/list
        # Substituição: $1 vira /games/list
        rewrite ^/api(/.*)$ $1 break;

        # Redireciona tudo que COMEÇA com /api vai para http://nginx-java-balancer:8080 (ex: http://localhost/api/games)
        # É preciso o uso do rewrite pois a url do proxy_pass(comando abaixo) NÃO termina com /. Caso não tenha a barra
        # no final e nem o rewrite será redirecionado com a uri do location. Ex.: Caso o usuário digite
        # http://localhost/api/lists/1/games vai ser redirecionado para
        # http://nginx-java-balancer:8080/api/lists/1/games. Mas caso tenha barra ou rewrite, e digite esse mesmo
        # endereço(http://localhost/api/lists/1/games) vai ser redirecionado para
        # http://nginx-java-balancer:8080/lists/1/games
        proxy_pass http://nginx-java-balancer:8080;

        # Encaminha o nome do host original para o servidor de destino
        proxy_set_header Host $host;
        # Encaminha o IP real do cliente para o servidor de destino
        proxy_set_header X-Real-IP $remote_addr;

        # Permite que NGINX trate os erros retornados pelo backend (como 404, 500, etc)
        proxy_intercept_errors on;
    }

    # Define o que fazer quando a URL terminar com ".html"
    location ~ \.html$ {
        # Redireciona a requisição para o servidor padrão, que escuta na porta 8081
        proxy_pass http://server1:8081;

        # Encaminha o nome do host original para o servidor de destino
        proxy_set_header Host $host;
        # Encaminha o IP real do cliente para o servidor de destino
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ \.css$ {
        # Redireciona a requisição para o servidor padrão, que escuta na porta 80
        proxy_pass http://server2:8082;

        # Encaminha o nome do host original para o servidor de destino
        proxy_set_header Host $host;
        # Encaminha o IP real do cliente para o servidor de destino
        proxy_set_header X-Real-IP $remote_addr;

       #add_header Content-Type text/css;
    }

    # Define que os códigos de erro 400, 401 e 404 serão tratados com a página /error40x.html
    error_page   400 401 404  /error40x.html;
    # Define um bloco de localização exato para /error40x.html
    location = /error40x.html {
        # Diretório onde o arquivo de erro está localizado
        root   /usr/share/nginx/error;
    }

    # Define que os códigos de erro 500, 502, 503 e 504 serão tratados com a página /error50x.html
    error_page   500 502 503 504  /error50x.html;
    # Define um bloco de localização exato para /error50x.html
    location = /error50x.html {
        # Diretório onde o arquivo de erro está localizado
        root   /usr/share/nginx/error;
    }
}
