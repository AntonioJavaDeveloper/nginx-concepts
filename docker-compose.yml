services:
  nginx:
    image: nginx:1.26
    container_name: nginx-server
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./settings/nginx.conf:/etc/nginx/nginx.conf
      - ./settings/servers/proxy-reverse.conf:/etc/nginx/servers/proxy-reverse.conf:ro
      - ./web/error:/usr/share/nginx/error
    restart: unless-stopped
    depends_on:
      - games1

  server1:
    image: nginx:1.26
    container_name: server1-html
    expose:
      - "8081"
    volumes:
      - ./settings/nginx.conf:/etc/nginx/nginx.conf
      - ./settings/servers/server1-html.conf:/etc/nginx/servers/server1-html.conf
      - ./web/server1:/usr/share/nginx/server1
      - ./web/error:/usr/share/nginx/error
    restart: unless-stopped

  server2:
    image: nginx:1.26
    container_name: server2-css
    expose:
      - "8082"
    volumes:
      - ./settings/nginx.conf:/etc/nginx/nginx.conf
      - ./settings/servers/server2-css.conf:/etc/nginx/servers/server2-css.conf
      - ./web/server2:/usr/share/nginx/server2
      - ./web/error:/usr/share/nginx/error
    restart: unless-stopped

  games1:
    build:
      context: ./java/games1
      dockerfile: docker/Dockerfile
    container_name: games1-app
    expose:
      - "9001"
    restart: unless-stopped
